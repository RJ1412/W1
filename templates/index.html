<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f8f5f0]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Study Buddy</title>
    <!-- Google Fonts: Warm & Classic Reading Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        cream: {
                            50: '#fdfbf9',
                            100: '#f8f5f0',
                            200: '#efe8de',
                            300: '#e3d7c8',
                        },
                        choco: {
                            100: '#d7c7b8',
                            200: '#ba9e89',
                            400: '#8c684e',
                            600: '#5c4033',
                            700: '#4a3328',
                            800: '#3a271e',
                            900: '#2c1d16',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: block; }
        .htmx-request.htmx-indicator { display: block; }

        /* Minimal scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8f5f0; }
        ::-webkit-scrollbar-thumb { background: #d7c7b8; border-radius: 3px; }

        /* Clean formatting for AI response */
        #formatted-solution h3 {
            color: #3a271e;
            font-size: 1.05rem;
            font-weight: 700;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #efe8de;
        }
        #formatted-solution p {
            margin-top: 0.4rem;
            margin-bottom: 0.6rem;
            line-height: 1.65;
            color: #4a382e;
        }
        #formatted-solution ul, #formatted-solution ol {
            margin-top: 0.4rem;
            margin-bottom: 0.6rem;
            padding-left: 1.25rem;
        }
        #formatted-solution li {
            margin-top: 0.2rem;
            margin-bottom: 0.2rem;
            color: #4a382e;
        }
        #formatted-solution strong {
            color: #2c1d16;
            font-weight: 600;
        }
    </style>
</head>
<body class="min-h-full bg-[#f8f5f0] text-choco-900 font-sans antialiased p-4 sm:p-8">

    <div class="max-w-3xl mx-auto">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-serif font-semibold text-choco-900">
                Exam Study Buddy
            </h1>
            <p class="mt-1.5 text-sm text-choco-600">
                Simple, friendly mistake explanations for any competitive exam
            </p>
        </header>

        <!-- Main Card -->
        <main class="bg-white border border-cream-300 rounded-2xl p-6 sm:p-8 shadow-sm">
            
            <form hx-post="/ask" hx-target="#response" hx-indicator="#loading" class="space-y-5">
                
                <!-- Exam Pills -->
                <div>
                    <label class="block text-xs font-semibold text-choco-700 uppercase tracking-wide mb-2">
                        Target Exam
                    </label>
                    <div class="flex flex-wrap gap-1.5 mb-3" id="exam-chips">
                        <button type="button" onclick="selectExam('SSC CGL / CHSL')" class="exam-chip px-3 py-1 rounded-lg text-xs font-medium bg-choco-700 text-white transition-colors">
                            SSC
                        </button>
                        <button type="button" onclick="selectExam('Banking (IBPS / SBI)')" class="exam-chip px-3 py-1 rounded-lg text-xs font-medium bg-cream-100 hover:bg-cream-200 text-choco-800 border border-cream-300 transition-colors">
                            Banking
                        </button>
                        <button type="button" onclick="selectExam('UPSC / State PSC')" class="exam-chip px-3 py-1 rounded-lg text-xs font-medium bg-cream-100 hover:bg-cream-200 text-choco-800 border border-cream-300 transition-colors">
                            UPSC / PSC
                        </button>
                        <button type="button" onclick="selectExam('CAT / MBA')" class="exam-chip px-3 py-1 rounded-lg text-xs font-medium bg-cream-100 hover:bg-cream-200 text-choco-800 border border-cream-300 transition-colors">
                            CAT / MBA
                        </button>
                        <button type="button" onclick="selectExam('Railways (RRB)')" class="exam-chip px-3 py-1 rounded-lg text-xs font-medium bg-cream-100 hover:bg-cream-200 text-choco-800 border border-cream-300 transition-colors">
                            Railways
                        </button>
                        <button type="button" onclick="selectExam('Other Exam')" class="exam-chip px-3 py-1 rounded-lg text-xs font-medium bg-cream-100 hover:bg-cream-200 text-choco-800 border border-cream-300 transition-colors">
                            Other
                        </button>
                    </div>

                    <!-- Config Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <input type="text" id="exam-input" name="exam" value="SSC CGL / CHSL" class="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-choco-900 focus:outline-none focus:border-choco-400" placeholder="Exam name" required>
                        </div>
                        <div>
                            <input type="text" id="student-name-input" name="student_name" value="Aman" class="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-choco-900 focus:outline-none focus:border-choco-400" placeholder="Your name">
                        </div>
                        <div>
                            <select name="language" class="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-choco-900 focus:outline-none focus:border-choco-400">
                                <option value="Hinglish" selected>Hinglish (Roman)</option>
                                <option value="English">English</option>
                                <option value="Hindi">Hindi</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Question -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-choco-700 uppercase tracking-wide">
                            Question
                        </label>
                        <div class="flex items-center gap-1.5 text-xs text-choco-600">
                            <span>Samples:</span>
                            <button type="button" onclick="loadSample('ssc')" class="underline hover:text-choco-900">SSC</button>
                            <span>•</span>
                            <button type="button" onclick="loadSample('bank')" class="underline hover:text-choco-900">Bank</button>
                            <span>•</span>
                            <button type="button" onclick="loadSample('upsc')" class="underline hover:text-choco-900">UPSC</button>
                            <span>•</span>
                            <button type="button" onclick="loadSample('cat')" class="underline hover:text-choco-900">CAT</button>
                        </div>
                    </div>
                    <textarea 
                        id="question-input" 
                        name="question" 
                        rows="4" 
                        class="w-full bg-cream-50 border border-cream-300 rounded-xl p-3.5 text-sm text-choco-900 placeholder-choco-200 focus:outline-none focus:border-choco-400 leading-relaxed" 
                        placeholder="Paste mock test question here..." 
                        required></textarea>
                </div>

                <!-- Mistake -->
                <div>
                    <label class="block text-xs font-semibold text-choco-700 uppercase tracking-wide mb-1.5">
                        Your Answer / Mistake
                    </label>
                    <textarea 
                        id="answer-input" 
                        name="answer" 
                        rows="2" 
                        class="w-full bg-cream-50 border border-cream-300 rounded-xl p-3.5 text-sm text-choco-900 placeholder-choco-200 focus:outline-none focus:border-choco-400 leading-relaxed" 
                        placeholder="What did you mark? What confused you?" 
                        required></textarea>
                </div>

                <!-- Submit / Clear -->
                <div class="flex items-center gap-2 pt-1">
                    <button 
                        type="submit" 
                        class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-choco-700 hover:bg-choco-800 transition-colors">
                        Explain My Mistake
                    </button>
                    <button 
                        type="button" 
                        onclick="clearForm()" 
                        class="py-2.5 px-4 rounded-xl text-xs font-medium text-choco-700 bg-cream-100 hover:bg-cream-200 border border-cream-300 transition-colors">
                        Clear
                    </button>
                </div>
            </form>

            <!-- Loading Indicator -->
            <div id="loading" class="htmx-indicator mt-6 py-6 text-center text-sm text-choco-600 bg-cream-50 rounded-xl border border-cream-300">
                <span class="inline-block animate-pulse">Buddy is analyzing your question...</span>
            </div>

            <!-- Response Target -->
            <div id="response" class="mt-6"></div>

        </main>

        <footer class="mt-6 text-center text-xs text-choco-400">
            Exam Study Buddy • Simple, calm learning tool
        </footer>

    </div>

    <!-- Scripts -->
    <script>
        function selectExam(name) {
            document.getElementById('exam-input').value = name;
            const chips = document.querySelectorAll('.exam-chip');
            chips.forEach(chip => {
                if (chip.innerText.includes(name) || (name.includes('SSC') && chip.innerText === 'SSC') || (name.includes('Bank') && chip.innerText === 'Banking') || (name.includes('UPSC') && chip.innerText.includes('UPSC')) || (name.includes('CAT') && chip.innerText.includes('CAT')) || (name.includes('Railways') && chip.innerText === 'Railways') || (name.includes('Other') && chip.innerText === 'Other')) {
                    chip.className = "exam-chip px-3 py-1 rounded-lg text-xs font-medium bg-choco-700 text-white transition-colors";
                } else {
                    chip.className = "exam-chip px-3 py-1 rounded-lg text-xs font-medium bg-cream-100 hover:bg-cream-200 text-choco-800 border border-cream-300 transition-colors";
                }
            });
        }

        const samples = {
            ssc: {
                exam: 'SSC CGL / CHSL',
                q: "A can complete a piece of work in 12 days and B can complete the same work in 18 days. If they work together for 4 days, what fraction of the total work is left?\n(A) 4/9\n(B) 5/9\n(C) 1/3\n(D) 2/3",
                a: "Maine option (A) 4/9 mark kiya tha kyunki calculate kiya 4 din mein 4/9 kaam hua, par question mein work left pucha tha."
            },
            bank: {
                exam: 'Banking (IBPS / SBI)',
                q: "Statements:\n1. Only a few Books are Pens.\n2. All Pens are Papers.\n3. No Paper is Eraser.\n\nConclusions:\nI. Some Books can never be Erasers.\nII. All Erasers can be Books.\nWhich conclusion logically follows?",
                a: "Maine conclusion I mark kiya tha, conclusion II mein confusion hua."
            },
            upsc: {
                exam: 'UPSC / State PSC',
                q: "Consider the following statements regarding the Writ of Mandamus in India:\n1. It can be issued against a private individual.\n2. It cannot be issued to enforce departmental instructions.\nWhich of the statements given above are correct?\n(A) 1 only\n(B) 2 only\n(C) Both 1 and 2\n(D) Neither 1 nor 2",
                a: "Maine (C) mark kiya tha."
            },
            cat: {
                exam: 'CAT / MBA',
                q: "A trader marks goods 50% above CP and offers a discount of 20%. What is his net profit percentage?\n(A) 20%\n(B) 25%\n(C) 30%\n(D) 15%",
                a: "Maine 50 - 20 = 30% calculate kiya."
            }
        };

        function loadSample(key) {
            const data = samples[key];
            if (!data) return;
            selectExam(data.exam);
            document.getElementById('question-input').value = data.q;
            document.getElementById('answer-input').value = data.a;
        }

        function clearForm() {
            document.getElementById('question-input').value = '';
            document.getElementById('answer-input').value = '';
            document.getElementById('response').innerHTML = '';
        }

        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'response') {
                const rawEl = document.getElementById('raw-markdown-content');
                const formattedEl = document.getElementById('formatted-solution');
                if (rawEl && formattedEl && window.marked) {
                    try {
                        formattedEl.innerHTML = marked.parse(rawEl.value || rawEl.textContent);
                    } catch(err) {
                        console.error('Marked error:', err);
                    }
                }
                const card = document.getElementById('solution-card');
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
        });

        function copySolution() {
            const rawEl = document.getElementById('raw-markdown-content');
            const copyBtn = document.getElementById('copy-btn');
            if (!rawEl) return;
            navigator.clipboard.writeText(rawEl.value || rawEl.textContent).then(() => {
                const prev = copyBtn.innerText;
                copyBtn.innerText = 'Copied!';
                setTimeout(() => { copyBtn.innerText = prev; }, 1800);
            });
        }
    </script>
</body>
</html>
